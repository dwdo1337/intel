<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 260px; margin: 0; padding: 16px; background: #000; color: #fff;
    font: 500 14px/1.4 Inter, system-ui, sans-serif; }
  h1 { margin: 0 0 2px; font-size: 18px; font-weight: 900; letter-spacing: -.4px; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8e929b; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4f6d; }
  .dot.on { background: #2bf08c; }
  .row { display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; background: #111214; border-radius: 14px; padding: 12px 14px; font-weight: 600; }
  input[type=checkbox] { accent-color: #2bf08c; width: 18px; height: 18px; }
  input[type=number] { width: 60px; background: #1a1b1f; border: 0; color: #fff; font: inherit;
    border-radius: 8px; padding: 6px 8px; }
  button { width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 14px;
    background: #1a1b1f; color: #fff; font: 800 15px Inter, system-ui, sans-serif; cursor: pointer; }
  button:hover { filter: brightness(1.3); }
  .hint { margin-top: 12px; font-size: 12px; color: #5c6069; line-height: 1.5; }
</style>
</head>
<body>
  <h1>intel.</h1>
  <div class="live"><i class="dot" id="dot"></i><span id="conn">checking…</span></div>

  <div class="row"><span>Show alerts</span><input type="checkbox" id="enabled"></div>
  <div class="row"><span>Seconds on screen</span><input type="number" id="seconds" min="4" max="60"></div>

  <button id="test">Show a preview</button>
  <button id="open">Open the deck</button>

  <p class="hint">Alerts appear inside the page you are on. Nothing is sent to
  the Windows notification centre. Which calls are worth an alert is decided
  in the deck, under the bell on each chain.</p>

<script src="popup.js" type="module"></script>
</body>
</html>
